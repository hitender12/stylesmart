[package]
name = "stylesmart"
version = "0.2.0"
edition = "2021"
description = "StyleSmart — the AI Operating System for Personal Appearance (Rust backend)"
license = "MIT"

[[bin]]
name = "stylesmart"
path = "src/main.rs"

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.31", features = ["bundled"] }
chrono = "0.4"

[dev-dependencies]
ureq = { version = "2", features = ["json"] }
